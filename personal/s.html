<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 For You my baby girl, my cutie girl 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 2s ease-in;
        }
        
        .heart {
            font-size: 80px;
            animation: beat 1s infinite;
            display: inline-block;
        }
        
        .message {
            font-size: 2.5rem;
            color: #e75480;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .sub-message {
            font-size: 1.3rem;
            color: #c44569;
            font-style: italic;
            margin-top: 20px;
        }
        
        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        .floating-heart {
            position: absolute;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
            font-size: 24px;
        }
        
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="hearts"></div>
    
    <div class="container">
        <div class="heart">💖</div>
        <h1 class="message">I Love You! Sara baby.</h1>
        <p class="sub-message">If my heart could choose one place to belong, it would always choose you ✨</p>
        <div style="margin-top: 30px; font-size: 40px;">
            🌹 💝 🌹
        </div>
    </div>

    <script>
        // Create floating hearts
        const heartsContainer = document.getElementById('hearts');
        const heartEmojis = ['💕', '💗', '💓', '💞', '💘', '❤️', '💜', '💛'];
        
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('span');
            heart.className = 'floating-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heart.style.animationDuration = (4 + Math.random() * 4) + 's';
            heartsContainer.appendChild(heart);
        }
    </script>
</body>
</html>
